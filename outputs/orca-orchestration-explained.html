:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

    --border,

  color: var(--foreground);
  background: transparent !important;

  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

.cursor-interaction {
  cursor: var(--cursor-interaction, pointer);
}

a {

  cursor: var(--cursor-interaction, pointer);
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h1 {

}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);

}

.table-responsive {

}

.table {

  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);

.viz-grid {

}

.viz-stat {

  gap: 2px;
}

.viz-stat-value {

}

.viz-row {
  display: flex;

  align-items: center;
  gap: 10px;
}

  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {

  border: 0;
  border-radius: var(--radius-full);

.progress-bar:only-child {

.progress-bar {

.viz-badge {

}

.text-muted {

}

.tabular-nums {

}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {

  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;

  margin: 0;

  border: 1px solid var(--input);

  background: var(--foreground);
  background-clip: padding-box;

.btn-primary .text-muted {

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;orca-orchestration-xu&#x27;);
      const viewSelect = root.querySelector(&#x27;#orca-view&#x27;);
      const componentSelect = root.querySelector(&#x27;#orca-component&#x27;);

      const source = root.querySelector(&#x27;#orca-source&#x27;);
      const runtime = &#x27;src/main/runtime/&#x27;;
      const rpc = runtime + &#x27;rpc/methods/orchestration/&#x27;;
      const db = runtime + &#x27;orchestration/db/&#x27;;
      const views = {
        system: {
          title:&#x27;A coordinator agent directs an Orca runtime&#x27;, rows:6,
          description:&#x27;The human supplies a goal. The coordinator agent calls the Orca CLI and RPC runtime. The runtime persists coordination in SQLite and launches workers in their execution environments. Workers exchange durable messages, edit files, and publish status to UI subscribers.&#x27;,
          nodes:[
            {id:&#x27;goal&#x27;,x:.5,r:0,title:&#x27;Human goal&#x27;,sub:&#x27;scope + acceptance&#x27;,what:&#x27;Human: defines the goal and keeps approval authority; a supervised Run binds an objective to its coordinator.&#x27;,file:rpc+&#x27;runs/runs.ts&#x27;},
            {id:&#x27;coordinator&#x27;,x:.25,r:1,title:&#x27;Coordinator agent&#x27;,sub:&#x27;plans + verifies&#x27;,what:&#x27;Coordinator: decomposes work, chooses parallel waves, answers questions, and validates results. A Run does not itself schedule workers; the old automatic coordinator command is retired.&#x27;,file:&#x27;src/cli/handlers/orchestration/dispatch-handlers.ts&#x27;},
            {id:&#x27;ui&#x27;,x:.75,r:1,title:&#x27;Desktop / phone&#x27;,sub:&#x27;view + control&#x27;,what:&#x27;Interfaces: display workspaces, agent sessions, and status. Readers subscribe to the execution host’s status store; presentation policy stays in the readers.&#x27;,file:&#x27;docs/reference/agent-status-store.md&#x27;},
            {id:&#x27;cli&#x27;,x:.25,r:2,title:&#x27;orca CLI → RPC&#x27;,sub:&#x27;typed operations&#x27;,what:&#x27;CLI: resolves the caller and translates commands into runtime RPC operations such as orchestration.dispatch. Mutation requests carry durable retry identity.&#x27;,file:&#x27;src/cli/handlers/orchestration/dispatch-handlers.ts&#x27;},
            {id:&#x27;runtime&#x27;,x:.75,r:2,title:&#x27;Orca runtime&#x27;,sub:&#x27;validate + route&#x27;,what:&#x27;Runtime: binds Runs to live callers, validates requests, routes mail, and owns worker lifecycle operations. It is coordination machinery; the agent supplies the plan.&#x27;,file:rpc+&#x27;runs/runs.ts&#x27;},
            {id:&#x27;sqlite&#x27;,x:.25,r:3,title:&#x27;SQLite · WAL&#x27;,sub:&#x27;coordination state&#x27;,what:&#x27;Persistence: orchestration.db stores Runs, Tasks, Dispatches, mail, Deliveries, and mutation receipts. SQLite uses WAL; this state is separate from provider chat transcripts.&#x27;,file:runtime+&#x27;orchestration/db/orchestration-db.ts&#x27;},
            {id:&#x27;launcher&#x27;,x:.75,r:3,title:&#x27;Worker launcher&#x27;,sub:&#x27;placement + readiness&#x27;,what:&#x27;Launcher: selects an existing workspace or creates a worktree, starts an agent session or terminal, waits for readiness, and delivers the Task’s dispatch preamble.&#x27;,file:rpc+&#x27;worker/local-worker-start.ts&#x27;},
            {id:&#x27;mailbox&#x27;,x:.25,r:4,title:&#x27;Durable mailboxes&#x27;,sub:&#x27;send · check · ack&#x27;,what:&#x27;Mailbox: questions, replies, heartbeats, and outcome reports persist. Delivery batches replay until acknowledged. A timed-out ask can resume the same question; a wake-up does not prove the recipient read the message.&#x27;,file:rpc+&#x27;messaging/check-run.ts&#x27;},
            {id:&#x27;workers&#x27;,x:.75,r:4,title:&#x27;Worker agents&#x27;,sub:&#x27;PTY / structured&#x27;,what:&#x27;Workers: Codex, Claude, or another supported provider executes the Task. PTY workers receive a terminal prompt; structured workers receive a provider-acknowledged turn. Both get the same preamble.&#x27;,file:rpc+&#x27;worker/deliver-worker-dispatch-preamble.ts&#x27;},
            {id:&#x27;status&#x27;,x:.25,r:5,title:&#x27;Agent status store&#x27;,sub:&#x27;host-owned evidence&#x27;,what:&#x27;Status: hooks, relay evidence, and structured-session summaries converge in the canonical host-owned store. A heartbeat proves liveness; it does not settle a Task.&#x27;,file:&#x27;docs/reference/agent-status-store.md&#x27;},
            {id:&#x27;files&#x27;,x:.75,r:5,title:&#x27;Workspace files&#x27;,sub:&#x27;worktree / folder&#x27;,what:&#x27;Work: agents operate on the selected execution host’s files and tools. Separate worktrees can isolate edits; workers can also share a workspace, so edit ownership must be explicit.&#x27;,file:rpc+&#x27;worker/local-worker-start.ts&#x27;}
          ],
          edges:[[&#x27;goal&#x27;,&#x27;coordinator&#x27;],[&#x27;goal&#x27;,&#x27;ui&#x27;],[&#x27;coordinator&#x27;,&#x27;cli&#x27;],[&#x27;ui&#x27;,&#x27;runtime&#x27;],[&#x27;cli&#x27;,&#x27;runtime&#x27;],[&#x27;runtime&#x27;,&#x27;sqlite&#x27;],[&#x27;runtime&#x27;,&#x27;launcher&#x27;],[&#x27;sqlite&#x27;,&#x27;mailbox&#x27;],[&#x27;launcher&#x27;,&#x27;workers&#x27;],[&#x27;workers&#x27;,&#x27;mailbox&#x27;],[&#x27;mailbox&#x27;,&#x27;coordinator&#x27;],[&#x27;workers&#x27;,&#x27;status&#x27;],[&#x27;workers&#x27;,&#x27;files&#x27;]]
        },
        lifecycle: {
          title:&#x27;One Task can have several attempts; only the active attempt has authority&#x27;, rows:8,
          description:&#x27;A Run contains independent Tasks A and B. Each ready Task is bound to a Dispatch attempt and a worker. A validated worker_done commits Task and Dispatch settlement and a replay receipt atomically. Dependent Task C becomes ready only when both prerequisites complete. The coordinator processes and acknowledges its delivery, then explicitly reuses, retains, or releases the worker.&#x27;,
          nodes:[
            {id:&#x27;run&#x27;,x:.5,r:0,title:&#x27;Run&#x27;,sub:&#x27;objective + inbox&#x27;,what:&#x27;Run: a durable namespace tied to a coordinator identity and inbox. Binding generations fence replaced consumers; creating a Run does not launch a scheduler.&#x27;,file:rpc+&#x27;runs/runs.ts&#x27;},
            {id:&#x27;task-a&#x27;,x:.25,r:1,title:&#x27;Task A&#x27;,sub:&#x27;spec + owner&#x27;,what:&#x27;Task: durable work with a self-contained specification, status, and dependencies. Tasks A and B are an illustrative independent wave, not a live execution.&#x27;,file:db+&#x27;schema/create-graph-tables-sql.ts&#x27;},
            {id:&#x27;task-b&#x27;,x:.75,r:1,title:&#x27;Task B&#x27;,sub:&#x27;spec + owner&#x27;,what:&#x27;Parallel work: the coordinator starts ready independent Tasks. Orca records dependency facts; starting another agent is separate from scheduling the next wave.&#x27;,file:db+&#x27;tasks/task-store.ts&#x27;},
            {id:&#x27;attempt-a&#x27;,x:.25,r:2,title:&#x27;Dispatch A&#x27;,sub:&#x27;authoritative attempt&#x27;,what:&#x27;Dispatch: one Task attempt bound to worker identity, process incarnation, capability hash, host scope, and nesting depth. Retries get new attempts; stale reports cannot settle them. A new Run does not reset the worker depth cap.&#x27;,file:db+&#x27;schema/create-graph-tables-sql.ts&#x27;},
            {id:&#x27;attempt-b&#x27;,x:.75,r:2,title:&#x27;Dispatch B&#x27;,sub:&#x27;authoritative attempt&#x27;,what:&#x27;Claim: a ready Task and an available worker are checked when authority is assigned. Durable mutation receipts make acceptance inspectable instead of blindly duplicating a launch.&#x27;,file:db+&#x27;worker-dispatch/worker-dispatch-start.ts&#x27;},
            {id:&#x27;worker-a&#x27;,x:.25,r:3,title:&#x27;Worker A&#x27;,sub:&#x27;live preamble&#x27;,what:&#x27;Preamble: contains Task ID, Dispatch ID, exact worker identity, and scoped commands for ask, heartbeat, checking mail, and worker_done. Knowing an ID alone does not grant authority.&#x27;,file:runtime+&#x27;orchestration/preamble.ts&#x27;},
            {id:&#x27;worker-b&#x27;,x:.75,r:3,title:&#x27;Worker B&#x27;,sub:&#x27;live preamble&#x27;,what:&#x27;Start proof: accepted input and observed turn start are distinct. If supported observation finds no turn start, the worker remains start_unknown; Orca keeps its resources for inspection.&#x27;,file:rpc+&#x27;worker/worker-start-readiness-settlement.ts&#x27;},
            {id:&#x27;report&#x27;,x:.5,r:4,title:&#x27;worker_done&#x27;,sub:&#x27;succeeded / failed&#x27;,what:&#x27;Report: workers explicitly send success or failure with both lifecycle IDs. The runtime validates the sender, capability, current process, and active attempt before accepting settlement.&#x27;,file:rpc+&#x27;messaging/send-point-to-point.ts&#x27;},
            {id:&#x27;commit&#x27;,x:.5,r:5,title:&#x27;Atomic settlement&#x27;,sub:&#x27;state + mail + receipt&#x27;,what:&#x27;Commit: worker_done stores the message, reconciles Task/Dispatch outcome, and records replay evidence in one transaction. Only after commit does the runtime wake the coordinator.&#x27;,file:rpc+&#x27;messaging/send-point-to-point.ts&#x27;},
            {id:&#x27;dependent&#x27;,x:.25,r:6,title:&#x27;Task C → ready&#x27;,sub:&#x27;needs A + B&#x27;,what:&#x27;Dependencies: C is promoted from pending to ready only when every prerequisite is completed. Failure is not completion. The coordinator still decides when to launch C.&#x27;,file:db+&#x27;tasks/task-store.ts&#x27;},
            {id:&#x27;delivery&#x27;,x:.75,r:6,title:&#x27;Delivery batch&#x27;,sub:&#x27;replay until ack&#x27;,what:&#x27;Delivery: check returns the oldest outstanding batch; an unacknowledged batch is replayed. The coordinator answers questions and validates results before acknowledging its delivery ID.&#x27;,file:rpc+&#x27;messaging/check-run.ts&#x27;},
            {id:&#x27;next&#x27;,x:.25,r:7,title:&#x27;Next wave&#x27;,sub:&#x27;coordinator decision&#x27;,what:&#x27;Next wave: readiness is a persisted fact, not automatic launch. The coordinator dispatches newly ready work through worker-start or the lower-level dispatch operation.&#x27;,file:db+&#x27;dispatch-row-writer.ts&#x27;},
            {id:&#x27;release&#x27;,x:.75,r:7,title:&#x27;Reuse / retain / release&#x27;,sub:&#x27;explicit next owner&#x27;,what:&#x27;Cleanup: settlement and terminal ownership are separate. After an accepted report, the coordinator reuses the terminal, records retention, or releases it; user input can reclaim ownership.&#x27;,file:rpc+&#x27;worker/worker-release.ts&#x27;}
          ],
          edges:[[&#x27;run&#x27;,&#x27;task-a&#x27;],[&#x27;run&#x27;,&#x27;task-b&#x27;],[&#x27;task-a&#x27;,&#x27;attempt-a&#x27;],[&#x27;task-b&#x27;,&#x27;attempt-b&#x27;],[&#x27;attempt-a&#x27;,&#x27;worker-a&#x27;],[&#x27;attempt-b&#x27;,&#x27;worker-b&#x27;],[&#x27;worker-a&#x27;,&#x27;report&#x27;],[&#x27;worker-b&#x27;,&#x27;report&#x27;],[&#x27;report&#x27;,&#x27;commit&#x27;],[&#x27;commit&#x27;,&#x27;dependent&#x27;],[&#x27;commit&#x27;,&#x27;delivery&#x27;],[&#x27;dependent&#x27;,&#x27;next&#x27;],[&#x27;delivery&#x27;,&#x27;release&#x27;]]
        },
        hosts: {
          title:&#x27;The host that executes work owns its processes, files, and evidence&#x27;, rows:6,
          description:&#x27;Local execution places the UI, control runtime, coordination database, and agents on one machine. Direct SSH keeps coordination on the client and execution on a remote relay. A paired runtime has a host-local control plane. Losing contact means unverifiable, not exited.&#x27;,
          nodes:[
            {id:&#x27;local&#x27;,x:.25,r:0,title:&#x27;Local machine&#x27;,sub:&#x27;one host&#x27;,what:&#x27;Local: the client runtime, coordination database, and worker execution share a machine. A folder workspace is valid; Git worktree creation is only one placement option.&#x27;,file:rpc+&#x27;worker/local-worker-start.ts&#x27;},
            {id:&#x27;local-worker&#x27;,x:.25,r:1,title:&#x27;Local agents&#x27;,sub:&#x27;files + tools&#x27;,what:&#x27;Local worker: the owning runtime launches and observes its agent. PTY and structured sessions use the same Task and Dispatch contract.&#x27;,file:rpc+&#x27;worker/deliver-worker-dispatch-preamble.ts&#x27;},
            {id:&#x27;ssh-client&#x27;,x:.75,r:0,title:&#x27;SSH client&#x27;,sub:&#x27;runtime + SQLite&#x27;,what:&#x27;Direct SSH: Runs, Tasks, Dispatches, and mailboxes live in the controlling client. Remote orca commands proxy back to that runtime; the remote host owns execution.&#x27;,file:&#x27;docs/reference/ssh-execution-boundary.md&#x27;},
            {id:&#x27;ssh-worker&#x27;,x:.75,r:1,title:&#x27;SSH execution host&#x27;,sub:&#x27;relay + agents&#x27;,what:&#x27;SSH host: repository, tools, credentials, processes, and transcripts remain remote. Losing the client connection can leave agents live while their Orca control channel is unavailable.&#x27;,file:&#x27;docs/reference/ssh-execution-boundary.md&#x27;},
            {id:&#x27;paired-ui&#x27;,x:.25,r:3,title:&#x27;Client UI&#x27;,sub:&#x27;remote view + control&#x27;,what:&#x27;Paired runtime: the client views a peer that owns its own control plane. This is different from using a remote host as a direct-SSH execution target.&#x27;,file:&#x27;docs/reference/ssh-execution-boundary.md&#x27;},
            {id:&#x27;paired-host&#x27;,x:.75,r:3,title:&#x27;Paired runtime host&#x27;,sub:&#x27;runtime + SQLite&#x27;,what:&#x27;Peer host: owns its own coordination runtime and worker execution. Its control plane can continue without the desktop client; survival still depends on host/service lifecycle.&#x27;,file:&#x27;docs/reference/ssh-execution-boundary.md&#x27;},
            {id:&#x27;paired-workers&#x27;,x:.75,r:4,title:&#x27;Peer workers&#x27;,sub:&#x27;host-local execution&#x27;,what:&#x27;Remote authority: process, stop, transcript, and cleanup facts must come from the host executing the worker. The client must not silently substitute local execution.&#x27;,file:&#x27;docs/reference/ssh-execution-boundary.md&#x27;},
            {id:&#x27;contact&#x27;,x:.5,r:5,title:&#x27;Lost contact&#x27;,sub:&#x27;unverifiable ≠ exited&#x27;,what:&#x27;Evidence rule: silence, a timeout, or a transport failure cannot prove process death. Positive host evidence is required to report exited or justify a duplicate retry.&#x27;,file:&#x27;docs/reference/ssh-execution-boundary.md&#x27;}
          ],
          edges:[[&#x27;local&#x27;,&#x27;local-worker&#x27;],[&#x27;ssh-client&#x27;,&#x27;ssh-worker&#x27;],[&#x27;paired-ui&#x27;,&#x27;paired-host&#x27;],[&#x27;paired-host&#x27;,&#x27;paired-workers&#x27;],[&#x27;ssh-worker&#x27;,&#x27;contact&#x27;],[&#x27;paired-workers&#x27;,&#x27;contact&#x27;]]
        }
      };
      const namespace = &#x27;http://www.w3.org/2000/svg&#x27;;
      let selected = &#x27;coordinator&#x27;;
      const make = (tag, attributes = {}, text) =&gt; {
        const element = document.createElementNS(namespace, tag);
        Object.entries(attributes).forEach(([key,value]) =&gt; element.setAttribute(key,value));
        if (text !== undefined) element.textContent = text;
        return element;
      };
      const save = () =&gt; {
        if (window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{view:viewSelect.value,component:selected},privateContent:null}).catch(() =&gt; {});
      };
      function draw() {
        const view = views[viewSelect.value];
        const width = Math.max(280,root.getBoundingClientRect().width);
        const rowGap = 96, height = view.rows * rowGap;
        const nodeWidth = Math.min(248,(width - 44) / 2);
        svg.setAttribute(&#x27;viewBox&#x27;,`0 0 ${width} ${height}`);
        svg.setAttribute(&#x27;height&#x27;,height);
        svg.replaceChildren(make(&#x27;title&#x27;,{id:&#x27;orca-diagram-title&#x27;},view.title),make(&#x27;desc&#x27;,{id:&#x27;orca-diagram-desc&#x27;},view.description));
        const defs = make(&#x27;defs&#x27;);
        const marker = make(&#x27;marker&#x27;,{id:&#x27;orca-arrow&#x27;,viewBox:&#x27;0 0 10 10&#x27;,refX:9,refY:5,markerWidth:6,markerHeight:6,orient:&#x27;auto-start-reverse&#x27;});
        marker.append(make(&#x27;path&#x27;,{d:&#x27;M 0 0 L 10 5 L 0 10 z&#x27;,fill:&#x27;var(--muted-foreground)&#x27;}));
        defs.append(marker); svg.append(defs);
        const positions = Object.fromEntries(view.nodes.map(node=&gt;[node.id,{x:node.x*width,y:node.r*rowGap+48}]));
        const canvas = document.createElement(&#x27;canvas&#x27;);
        const context = canvas.getContext(&#x27;2d&#x27;);
        const typography = getComputedStyle(root);
        context.font = `${typography.fontSize} ${typography.fontFamily}`;
        const wrap = text =&gt; {
          const lines = []; let current = &#x27;&#x27;;
          for (const word of text.split(&#x27; &#x27;)) {
            const next = current ? `${current} ${word}` : word;
            if (current &amp;&amp; context.measureText(next).width &gt; nodeWidth-18) {lines.push(current);current=word;} else current=next;
          }
          if (current) lines.push(current);
          return lines;
        };
        view.edges.forEach(([from,to])=&gt;{
          const a=positions[from],b=positions[to];
          let start,end;
          if(a.y===b.y){start=[a.x+nodeWidth/2,a.y];end=[b.x-nodeWidth/2-4,b.y];if(a.x&gt;b.x){start=[a.x-nodeWidth/2,a.y];end=[b.x+nodeWidth/2+4,b.y];}}
          else{const direction=Math.sign(b.y-a.y);start=[a.x,a.y+40*direction];end=[b.x,b.y-44*direction];}
          const middle=(start[1]+end[1])/2;
          let path = a.y===b.y ? `M${start} L${end}` : `M${start} C${start[0]},${middle} ${end[0]},${middle} ${end}`;
          if(b.y&lt;a.y)path=`M${a.x-nodeWidth/2},${a.y} H6 V${b.y} H${b.x-nodeWidth/2-4}`;
          if(b.y-a.y&gt;rowGap*2)path=`M${start} H${width-6} V${end[1]-12} H${end[0]} V${end[1]}`;
          svg.append(make(&#x27;path&#x27;,{d:path,class:&#x27;orca-edge&#x27;,&#x27;marker-end&#x27;:&#x27;url(#orca-arrow)&#x27;}));
        });
        view.nodes.forEach(node=&gt;{
          const point=positions[node.id];
          const group=make(&#x27;g&#x27;,{&#x27;data-component&#x27;:node.id,class:`cursor-interaction ${node.id===selected?&#x27;orca-selected&#x27;:&#x27;&#x27;}`,&#x27;data-tooltip&#x27;:node.title});
          group.append(make(&#x27;rect&#x27;,{x:point.x-nodeWidth/2,y:point.y-40,width:nodeWidth,height:80,rx:8,class:&#x27;orca-mark&#x27;}));
          const lines=wrap(node.title).concat(wrap(node.sub));
          lines.forEach((line,index)=&gt;group.append(make(&#x27;text&#x27;,{x:point.x,y:point.y-(lines.length-1)*9+index*18,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;dominant-baseline&#x27;:&#x27;middle&#x27;},line)));
          group.addEventListener(&#x27;click&#x27;,()=&gt;{selected=node.id;componentSelect.value=selected;draw();save();});

        const node=view.nodes.find(item=&gt;item.id===selected);
        detail.textContent=node.what;
        source.textContent=node.file;
      }
      function chooseView(id) {
        viewSelect.value=id;
        const nodes=views[id].nodes;
        if(!nodes.some(node=&gt;node.id===selected)) selected=id===&#x27;system&#x27;?&#x27;coordinator&#x27;:nodes[0].id;
        componentSelect.replaceChildren(...nodes.map(node=&gt;{const option=document.createElement(&#x27;option&#x27;);option.value=node.id;option.textContent=node.title;return option;}));
        componentSelect.value=selected;
        draw();
      }
      function restore(state) {
        const choice=state?.modelContent;
        if(!choice || !Object.hasOwn(views,choice.view))return;
        if(views[choice.view].nodes.some(node=&gt;node.id===choice.component))selected=choice.component;
        chooseView(choice.view);
      }

      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
